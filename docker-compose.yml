# MAHROS -- everything in one command:
#
#     docker compose up
#
#   db       PostgreSQL 16 (data kept in the "pgdata" volume)
#   loader   one-shot: real data -> pipeline -> database (safe to re-run)
#   app      the dashboard            -> http://localhost:8080
#   pgadmin  browse the tables        -> http://localhost:5050
#
# Passwords come from .env (see .env.example). The defaults below are for a
# demo on your own laptop only.

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-mahros}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahros-local}
  POSTGRES_DB: ${POSTGRES_DB:-mahros}

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mahros}:${POSTGRES_PASSWORD:-mahros-local}@db:5432/${POSTGRES_DB:-mahros}

services:
  db:
    image: postgres:16
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mahros} -d ${POSTGRES_DB:-mahros}"]
      interval: 3s
      timeout: 3s
      retries: 40

  loader:
    build: .
    image: mahros:0.3
    command: ["python", "-m", "mahros.db.load"]
    environment: *app-env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: mahros:0.3
    environment: *app-env
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-reviewer@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-mahros-local}
      # Desktop mode: opens straight on the tables, no pgAdmin login screen.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    configs:
      - source: pgpass
        target: /pgpass
        uid: "5050"
        gid: "0"
        mode: 0600
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

configs:
  pgpass:
    content: "db:5432:*:${POSTGRES_USER:-mahros}:${POSTGRES_PASSWORD:-mahros-local}"

volumes:
  pgdata:
