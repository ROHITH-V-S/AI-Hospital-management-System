# Render blueprint for the MAHROS dashboard.
#
#   https://render.com  ->  New  ->  Blueprint  ->  point at this repo
#
# No build step beyond pip install: the experiments need the national data
# cache and take tens of minutes, so they never run on the web instance. Their
# outputs are committed in results/ui/ and served read-only.
services:
  - type: web
    name: mahros
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mahros.server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
