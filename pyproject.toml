[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahros"
version = "0.2.0"
description = "Multi-Agent Hospital Resource Optimization System: trust-aware regional hospital load balancing, built and evaluated on real federal hospital capacity reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# What the experiments need. The dashboard server alone needs only `demo`.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.0", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["mahros*"]

[tool.setuptools.package-data]
"mahros.server" = ["static/*.html"]
"mahros.calibration" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
